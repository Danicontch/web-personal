backend:
  name: git-gateway
  branch: main

publish_mode: simple

media_folder: "uploads"
public_folder: "/uploads"

locale: "es"

collections:
  - name: "content"
    label: "Contenido del sitio"
    files:
      - file: "data/content.json"
        label: "Textos, precios y link de Calendly"
        name: "content"
        fields:
          - label: "Portada"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Frase principal (Español)", name: "lede_es", widget: "text", hint: "La frase grande debajo de tu nombre, en la portada." }
              - { label: "Main line (English)", name: "lede_en", widget: "text" }
              - { label: "Link de Calendly", name: "calendly_url", widget: "string", hint: "Se actualiza en los 3 botones 'Agenda una llamada' del sitio." }

          - label: "Nota personal"
            name: "personal_note"
            widget: "object"
            fields:
              - { label: "Español", name: "es", widget: "text" }
              - { label: "English", name: "en", widget: "text" }

          - label: "Servicios"
            name: "services"
            widget: "list"
            summary: "{{title_es}} — {{price_es}}"
            fields:
              - { label: "¿Es el servicio destacado?", name: "flagship", widget: "boolean", default: false, hint: "Solo uno debería estar marcado — es el que se ve resaltado." }
              - { label: "Precio (Español)", name: "price_es", widget: "string" }
              - { label: "Price (English)", name: "price_en", widget: "string" }
              - { label: "Título (Español)", name: "title_es", widget: "string" }
              - { label: "Title (English)", name: "title_en", widget: "string" }
              - { label: "Descripción (Español)", name: "desc_es", widget: "text" }
              - { label: "Description (English)", name: "desc_en", widget: "text" }
              - label: "Links de pago (Stripe)"
                name: "payments"
                widget: "list"
                hint: "Déjalo vacío si este servicio no se paga directo online (ej. requiere llamada primero)."
                summary: "{{label_es}}"
                allow_add: true
                fields:
                  - { label: "Texto del botón (Español)", name: "label_es", widget: "string" }
                  - { label: "Button text (English)", name: "label_en", widget: "string" }
                  - { label: "Link de pago de Stripe", name: "url", widget: "string" }
